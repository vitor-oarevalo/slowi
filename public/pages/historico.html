<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slowi - Histórico</title>
    <link rel="shortcut icon" href="../assets/icon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/index.css">

    <link rel="stylesheet" href="../css/diario.css">

<body>
    <button id="open-btn" class="open-menu-btn" type="button" aria-label="Abrir menu" aria-controls="menu-lateral" aria-expanded="true">

            <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
    </button>
    <div id="menu-overlay" class="menu-overlay"></div>

    <header class="index-menu" id="menu-lateral" aria-label="Menu principal">
        <ul>
            <li class="menu-header">
                <img src="../assets/img/slowi-logo.png" alt="Slowi" class="small-img-slowi">
                <button id="close-btn" type="button" aria-label="Fechar menu" aria-controls="menu-lateral"><img src="../assets/icon/close-menu.png" alt="" class="close-menu"></button>
            </li>
            <li><a href="index.html" class="menu-link"><img src="../assets/icon/index-menu-home.png" alt="" class="menu-icon">Início</a></li>
            <li><a href="diario.html" class="menu-link"><img src="../assets/icon/index-menu-diary.png" alt="" class="menu-icon">Diário Emocional</a></li>
            <li><a href="historico.html" class="menu-link selected" aria-current="page"><img src="../assets/icon/history.png" alt="" class="menu-icon">Histórico</a></li>
            <li><a href="dashboard.html" class="menu-link"><img src="../assets/icon/data-analytics.png" alt="" class="menu-icon">Gráficos</a></li>
            <li><a href="ajuda.html" class="menu-link"><img src="../assets/icon/index-menu-kindness.png" alt="" class="menu-icon">Onde buscar ajuda</a></li>
            <li><a href="sobre.html" class="menu-link"><img src="../assets/icon/info-button.png" alt="" class="menu-icon">Sobre mim</a></li>
        </ul>
        <div class="menu-rodape">
            <a href="perfil.html" class="menu-usuario">
                <span id="avatar" class="avatar" aria-hidden="true"></span>
                <span><strong id="username_tag"></strong><small>Ver perfil</small></span>
            </a>
            <button onclick="sair()" class="logout-link" aria-label="Sair"><img src="../assets/icon/logout.png" alt="" class="logout-img"></button>
        </div>
    </header>

    <main>
        <header class="topbar">
            <nav aria-label="Você está em"><strong>Diário emocional</strong> <span>Histórico</span></nav>
            <time id="hoje"></time>
        </header>

        <nav class="tabs" aria-label="Seções do diário">
            <a href="diario.html" class="tab">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Escrever
            </a>
            <a href="historico.html" class="tab selected-tab" aria-current="page">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Histórico
            </a>
            <a href="dashboard.html" class="tab">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Gráficos
            </a>
        </nav>

        <section class="diario-card" id="painel-historico">
            <p class="dica" id="historico-aviso">Seus registros anteriores vão aparecer aqui.</p>
            <div class="history-lista" id="history-lista"></div>
        </section>
    </main>

    <script src="../js/topbar.js"></script>
    <script src="../js/historico.js"></script>
    <script src="../js/menu.js"></script>
    <script>carregarHistorico();</script>
