<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crie sua conta</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="shortcut icon" href="../assets/icon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <main>
        <section class="form-section">
            <article class="form-article">
                <div class="form-article-header">
                    <a href="landing.html" class="logo-link"><img src="../assets/img/slowi-logo.png" class="slowi-logo" alt="slowi-logo"></a>
                    <h1>Que bom ter você aqui!</h1>
                    <p>Crie sua conta e descubra recursos para cuidar do seu bem-estar emocional.</p>
                </div>
                <div class="input">
                    <input type="text" name="" id="ipt_nome">
                    <label for="ipt_nome">Nome <span>*</span></label>
                </div>
                <div class="input">
                    <input type="email" name="" id="ipt_email">
                    <label for="ipt_email">E-mail <span>*</span></label>
                </div>
                <div class="input-container">
                    <div class="input">
                        <input type="password" name="" id="ipt_senha">
                        <label for="ipt_senha">Senha <span>*</span></label>
                    </div>
                    <div class="input">
                        <input type="password" name="" id="ipt_confirmar_senha">
                        <label for="ipt_confirmar_senha">Confirmar Senha <span>*</span></label>
                    </div>
                </div>
                <button>Criar conta</button>
                <p>Já possuo uma conta. <a href="" class="login-link">Entrar</a></p>

                
            </article>
            <article class="image-article">
                <img src="../assets/img/slowi-tree.png" alt="Slowi na árvore" class="slowi-tree-img">
                <div class="text-container">
                    <h1 class="lighter">Comece agora.</h1>
                    <h1 class="bolder">Sua saúde mental Slowi.</h1>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
