<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar na sua conta</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="shortcut icon" href="../assets/icon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <main>
        <section class="form-section">
            <article class="image-article">
                <img src="../assets/img/slowi-lendo.png" alt="Slowi lendo" class="slowi-lendo-img">
                <div class="text-container">
                    <h1 class="lighter">Seu espaço, seu tempo.</h1>
                    <h1 class="bolder">Fique à vontade.</h1>
                </div>
            </article>
            <article class="form-article">
                <div class="form-article-header">
                    <a href="landing-page.html" class="logo-link"><img src="../assets/img/slowi-logo.png" class="slowi-logo" alt="slowi-logo"></a>
                    <h1>Que bom ter você de volta!</h1>
                    <p>Entre na sua conta e continue de onde parou.</p>
                </div>
                <div class="input">
                    <input type="email" name="" id="ipt_email">
                    <label for="ipt_email">E-mail <span>*</span></label>
                </div>
                    <div class="input">
                        <input type="password" name="" id="ipt_senha">
                        <label for="ipt_senha">Senha <span>*</span></label>
                    </div>
                <button>Entrar</button>
                <p>Ainda não possuo uma conta. <a href="./cadastro.html" class="login-link">Cadastrar</a></p>

                
            </article>
            
        </section>
    </main>
</body>
</html>
